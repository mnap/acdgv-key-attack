[project]
name = "acdgv-key-attack"
version = "1.0.0"
description = "Code supplementing the paper 'Key Attack on the ACDGV Matrix Encryption Scheme'"
readme = "README.md"
# Python 3.14 is excluded because the locked numba/llvmlite stack used by galois
# is not supported there yet.
requires-python = ">=3.13,<3.14"
dependencies = [
    "galois>=0.4.4",
    "numpy>2.1",
]
[tool.uv]
constraint-dependencies = ["numba>0.59"]
